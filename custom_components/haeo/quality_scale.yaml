rules:
  # Bronze
  action-setup:
    status: done
    comment: async_setup registers haeo.optimize and haeo.save_diagnostics through async_setup_services in services.py, so the actions exist before any config entry loads.
  appropriate-polling:
    status: done
    comment: The coordinator has no update_interval; it is event driven through state change listeners with a debounced refresh.
  brands:
    status: done
    comment: Icons and logos ship in custom_components/haeo/brand/.
  common-modules:
    status: done
    comment: The coordinator lives in the coordinator/ package and the entity base classes in the entities/ package.
  config-flow:
    status: done
    comment: flows/hub.py provides the hub config flow and each element is a config subentry flow.
  config-flow-test-coverage:
    status: done
    comment: flows/tests/ and flows/elements/tests/ cover the hub, options, and element subentry flows.
  dependency-transparency:
    status: done
    comment: highspy and numpy are open source and published to PyPI from public CI.
  docs-actions:
    status: todo
    comment: haeo.save_diagnostics is described only in the historic diagnostics walkthrough, and haeo.optimize is not documented. The user guide needs a page describing both actions and their fields.
  docs-high-level-description:
    status: done
    comment: README.md and docs/index.md describe what HAEO does.
  docs-installation-instructions:
    status: done
    comment: docs/user-guide/installation.md covers HACS and manual installation.
  docs-removal-instructions:
    status: done
    comment: docs/user-guide/removal.md covers removal.
  entity-event-setup:
    status: done
    comment: Entities subscribe in async_added_to_hass and unsubscribe through async_on_remove; coordinator listeners are released by entry.async_on_unload.
  entity-unique-id:
    status: done
    comment: Every entity sets a unique ID derived from the entry, subentry, and field or output name.
  has-entity-name:
    status: done
    comment: All entity base classes set _attr_has_entity_name = True.
  runtime-data:
    status: done
    comment: async_setup_entry stores HaeoRuntimeData in ConfigEntry.runtime_data.
  test-before-configure:
    status: exempt
    comment: The hub config flow collects only local optimization settings; there is no device or service to connect to.
  test-before-setup:
    status: done
    comment: async_setup_entry raises ConfigEntryNotReady until every input is available and ConfigEntryError for invalid configuration.
  unique-config-entry:
    status: done
    comment: The hub flow sets a unique ID from the network name and aborts duplicates.

  # Silver
  action-exceptions:
    status: done
    comment: Both action handlers raise ServiceValidationError with translation keys.
  config-entry-unloading:
    status: done
    comment: async_unload_entry is implemented; platform unloading and listener teardown are registered with entry.async_on_unload.
  docs-configuration-parameters:
    status: done
    comment: docs/user-guide/ documents the hub settings and every element field.
  docs-installation-parameters:
    status: done
    comment: docs/user-guide/installation.md and the element pages describe the values needed during setup.
  entity-unavailable:
    status: done
    comment: Output sensors use CoordinatorEntity availability; input entities are backed by local input stores.
  integration-owner:
    status: done
    comment: manifest.json lists code owners.
  log-when-unavailable:
    status: done
    comment: Failed refreshes raise UpdateFailed, which the DataUpdateCoordinator logs once when unavailable and once when recovered.
  parallel-updates:
    status: done
    comment: sensor.py, number.py, and switch.py set PARALLEL_UPDATES = 0.
  reauthentication-flow:
    status: exempt
    comment: HAEO has no credentials or external service to authenticate against.
  test-coverage:
    status: done
    comment: Line coverage of custom_components/haeo is 99 percent.

  # Gold
  devices:
    status: done
    comment: entities/device.py creates a hub device and one device per element subentry.
  diagnostics:
    status: done
    comment: diagnostics/ implements async_get_config_entry_diagnostics.
  discovery:
    status: exempt
    comment: HAEO models a user-described energy network; there is no device to discover.
  discovery-update-info:
    status: exempt
    comment: HAEO has no discovery, so there is no discovery information to update.
  docs-data-update:
    status: done
    comment: docs/user-guide/data-updates.md explains when HAEO re-optimizes.
  docs-examples:
    status: done
    comment: docs/user-guide/automations.md has automation examples.
  docs-known-limitations:
    status: done
    comment: docs/user-guide/alternatives.md and docs/modeling/ describe what HAEO does not model.
  docs-supported-devices:
    status: exempt
    comment: HAEO reads arbitrary Home Assistant sensors rather than talking to specific hardware.
  docs-supported-functions:
    status: done
    comment: docs/user-guide/elements/ and docs/modeling/device-layer/ describe each element's inputs and output sensors.
  docs-troubleshooting:
    status: done
    comment: docs/user-guide/troubleshooting.md covers common problems.
  docs-use-cases:
    status: done
    comment: README.md and the walkthroughs describe example systems.
  dynamic-devices:
    status: done
    comment: Adding an element subentry reloads the entry, which creates the new element's device and entities.
  entity-category:
    status: done
    comment: Input entities use EntityCategory.CONFIG and diagnostic outputs use EntityCategory.DIAGNOSTIC.
  entity-device-class:
    status: done
    comment: Output sensors take their device class from the output metadata.
  entity-disabled-by-default:
    status: done
    comment: Outputs flagged advanced are disabled by default through _attr_entity_registry_enabled_default.
  entity-translations:
    status: done
    comment: Every entity uses a translation_key defined in translations/en.json.
  exception-translations:
    status: done
    comment: User-facing errors (action errors, setup errors, and optimization failures) use translation keys under exceptions in translations/en.json.
  icon-translations:
    status: exempt
    comment: No entity sets a custom icon; entities use their device class icons. Action icons are in icons.json.
  reconfiguration-flow:
    status: done
    comment: The hub config flow's reconfigure step edits the hub settings with the same form and validation as the options flow, and element subentry flows have their own reconfigure steps.
  repair-issues:
    status: done
    comment: repairs.py raises repair issues for disconnected networks, invalid connection endpoints, unavailable inputs, and optimization failures.
  stale-devices:
    status: done
    comment: Element devices are linked to their subentry, so removing the subentry removes the device; async_remove_config_entry_device allows removing devices no element creates.

  # Platinum
  async-dependency:
    status: exempt
    comment: highspy is a CPU-bound solver with no I/O, so it has no asyncio interface; the optimization runs in the executor through hass.async_add_executor_job.
  inject-websession:
    status: exempt
    comment: HAEO makes no HTTP requests.
  strict-typing:
    status: done
    comment: py.typed is shipped, pyright runs in strict mode in CI, and highspy and numpy ship py.typed.
